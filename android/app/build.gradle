apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "it.airgap.vault"
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 31
    defaultConfig {
        applicationId "it.airgap.vault"
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 31
        versionCode 33500
        versionName "3.35.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // Exclude non-16KB-aligned native libs (Android 15+ blocks launch).
            //   libsapling.so — Sapling shielded tx (upstream not 16KB-aligned)
            //   libtool-checker.so — RootBeer root detection (not critical)
            // Note: libsqlc-ndk-native-driver.so is no longer needed because
            // cordova-sqlite-storage was removed; storage falls back to localStorage.
            excludes += [
                'lib/arm64-v8a/libsapling.so',
                'lib/arm64-v8a/libtool-checker.so',
                'lib/armeabi-v7a/libsapling.so',
                'lib/armeabi-v7a/libtool-checker.so',
                'lib/x86/libsapling.so',
                'lib/x86/libtool-checker.so',
                'lib/x86_64/libsapling.so',
                'lib/x86_64/libtool-checker.so'
            ]
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "boolean", "APPIUM", "false"
            // Sign debug builds with the release keystore so they can be
            // installed OVER a release build (same signature) via `adb install -r`,
            // preserving app data. Falls back to the default debug key when
            // keystore.properties is absent.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "APPIUM", "false"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        appium {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "APPIUM", "true"
            matchingFallbacks = ['release']
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
}

repositories {
    google()
    jcenter()
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    mavenCentral()
}

dependencies {
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.exifinterface:exifinterface:$androidxExifinterfaceVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.webkit:webkit:1.7.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test:core:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    implementation "com.google.android.material:material:$androidxMaterialVersion"
    implementation 'com.scottyab:rootbeer-lib:0.0.7'

    def fragmentVersion = "1.4.0"
    implementation("androidx.fragment:fragment-ktx:$fragmentVersion")

    def biometricVersion = "1.2.0-alpha05"
    implementation("androidx.biometric:biometric:$biometricVersion")

    def coroutinesVersion = "1.6.0"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion")

    def saplingVersion = "0.0.7"
    implementation "com.github.airgap-it:airgap-sapling:$saplingVersion"

    implementation "org.bouncycastle:bcprov-jdk15on:1.70"

    implementation "androidx.javascriptengine:javascriptengine:1.0.0-alpha03"
    implementation 'com.google.guava:listenablefuture:1.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$coroutinesVersion"
}


apply from: 'capacitor.build.gradle'

configurations.all {
    exclude group: 'com.google.firebase', module: ''
    exclude group: 'com.google.android.gms', module: ''
}

// Align native .so files to 16KB page boundary for Android 15+ compatibility.
// Injected directly into the strip tasks' doLast so the aligned files are
// written before packageDebug reads them as inputs.
def alignSoFiles = { File dir ->
    def pythonScript = rootProject.file('../align_so_16kb.py')
    if (!dir.exists()) return
    dir.eachFileRecurse { f ->
        if (f.name.endsWith('.so')) {
            def cmd = ['python3', pythonScript.absolutePath, f.absolutePath, f.absolutePath]
            def proc = cmd.execute()
            def out = new StringBuffer()
            def err = new StringBuffer()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (proc.exitValue() != 0) {
                println "[align16KB] SKIP: ${f.name}: ${err.toString().split('\n')[0]}"
            } else {
                println "[align16KB] OK: ${f.name}"
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'stripDebugDebugSymbols' }.all { task ->
        task.doLast {
            alignSoFiles(file("${buildDir}/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib"))
        }
    }
    tasks.matching { it.name == 'stripReleaseReleaseSymbols' }.all { task ->
        task.doLast {
            alignSoFiles(file("${buildDir}/intermediates/stripped_native_libs/release/stripReleaseReleaseSymbols/out/lib"))
        }
    }
}
